generated: '2026-07-18'
method: searched
status: published
source: https://github.com/codeocean/codeocean-mcp-server
server:
  name: codeocean
  transport: stdio
  package: codeocean-mcp-server
  registry: pypi
  install: uvx codeocean-mcp-server
  runtime: python>=3.10
  auth:
    method: env
    env:
    - CODEOCEAN_DOMAIN   # your Code Ocean instance URL
    - CODEOCEAN_TOKEN    # API access token (cop_ prefix)
    - AGENT_ID           # optional, identifies the calling application
  clients:
  - VS Code
  - Claude Desktop
  - Cline
  - Roo Code
  - Cursor
  - Windsurf
description: >-
  Official Code Ocean MCP server. Provides tools to search and run capsules and
  pipelines and to manage data assets. Runs locally as a stdio child process;
  authenticates with a Code Ocean access token via environment variables.
tools:
# tool names read verbatim from src/codeocean_mcp_server/tools/*.py
- name: search_capsules
  description: Search for capsules matching specified criteria.
  source_operation: openapi/code-ocean-openapi.yml#searchCapsules
- name: search_pipelines
  description: Search for pipelines matching specified criteria.
  source_operation: openapi/code-ocean-openapi.yml#searchPipelines
- name: get_capsule
  description: Retrieve a capsule by its ID.
  source_operation: openapi/code-ocean-openapi.yml#getCapsule
- name: list_computations
  description: List all computations for a capsule.
  source_operation: openapi/code-ocean-openapi.yml#listCapsuleComputations
- name: attach_data_assets
  description: Attach data assets to a capsule.
  source_operation: openapi/code-ocean-openapi.yml#attachDataAssets
- name: detach_data_assets
  description: Remove attached data assets from a capsule.
  source_operation: openapi/code-ocean-openapi.yml#detachDataAssets
- name: get_capsule_app_panel
  description: Retrieve the app panel for a capsule, optionally for a specific version.
  source_operation: openapi/code-ocean-openapi.yml#getCapsuleAppPanel
- name: get_computation
  description: Retrieve a specific computation by its unique identifier.
  source_operation: openapi/code-ocean-openapi.yml#getComputation
- name: run_capsule
  description: Execute a capsule or a pipeline in Code Ocean and don't wait.
  source_operation: openapi/code-ocean-openapi.yml#runCapsule
- name: wait_until_completed
  description: Wait until a computation completes and return its details.
  source_operation: openapi/code-ocean-openapi.yml#getComputation
- name: list_computation_results
  description: List the output files generated by a completed computation.
  source_operation: openapi/code-ocean-openapi.yml#listComputationResults
- name: get_result_file_urls
  description: Get view and download URLs for a specific result file from a computation.
  source_operation: openapi/code-ocean-openapi.yml#getResultFileURLs
- name: download_and_read_a_file_from_computation
  description: Download a computation result file and return its content.
  source_operation: openapi/code-ocean-openapi.yml#getResultFileURLs
- name: rename_computation
  description: Rename an existing computation.
  source_operation: openapi/code-ocean-openapi.yml#renameComputation
- name: delete_computation
  description: Delete a computation and stop it if currently running.
  source_operation: openapi/code-ocean-openapi.yml#deleteComputation
- name: attach_computation_data_assets
  description: Attach data assets to a cloud workstation session.
  source_operation: openapi/code-ocean-openapi.yml#attachDataAssets
- name: detach_computation_data_assets
  description: Detach data assets from a cloud workstation session.
  source_operation: openapi/code-ocean-openapi.yml#detachDataAssets
- name: search_data_assets
  description: Retrieve data assets matching search criteria for datasets.
  source_operation: openapi/code-ocean-openapi.yml#searchDataAssets
- name: get_data_asset
  description: Retrieve a data asset by its ID.
  source_operation: openapi/code-ocean-openapi.yml#getDataAsset
- name: get_data_asset_file_urls
  description: Get view and download URLs for a specific file in a data asset.
  source_operation: openapi/code-ocean-openapi.yml#getDataAssetFileURLs
- name: download_and_read_a_file_from_data_asset
  description: Download a data asset file and return its content.
  source_operation: openapi/code-ocean-openapi.yml#getDataAssetFileURLs
- name: list_data_asset_files
  description: List files in a data asset.
  source_operation: openapi/code-ocean-openapi.yml#listDataAssetFiles
- name: update_metadata
  description: Update metadata for a specific data asset.
  source_operation: openapi/code-ocean-openapi.yml#updateDataAssetMetadata
- name: wait_until_ready
  description: Wait until a data asset is ready.
  source_operation: openapi/code-ocean-openapi.yml#getDataAsset
- name: create_data_asset
  description: Create a new data asset.
  source_operation: openapi/code-ocean-openapi.yml#createDataAsset
- name: get_custom_metadata
  description: Retrieve custom metadata configuration.
  source_operation: openapi/code-ocean-openapi.yml
