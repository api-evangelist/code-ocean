note: >-
  Code Ocean authenticates with scoped personal access tokens (prefix cop_)
  presented via HTTP Basic auth — not an OAuth2 authorization flow. Each token
  is minted with per-resource permission scopes selected in the Access Tokens
  UI (Account -> Access Tokens -> Generate New Token -> Select Scopes). The
  scopes below are the resource permissions documented as API prerequisites;
  the full enumerated list in the token UI is not published on a single docs
  page.
