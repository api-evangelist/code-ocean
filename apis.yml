aid: code-ocean
name: Code Ocean
description: >-
  Code Ocean is a computational research platform that helps scientists,
  engineers, and research organizations produce, manage, and reproduce
  computational science at scale. Its cloud environment centers on three
  resources — Capsules and Pipelines (self-contained, versioned compute
  environments that bundle code, data, environment, and results), Computations
  (tracked runs of those capsules and pipelines), and Data Assets (versioned
  datasets and captured results). Code Ocean exposes a REST API, an official
  Python SDK, and an official Model Context Protocol (MCP) server so teams can
  automate reproducible research, integrate the platform into data pipelines,
  and drive capsules and data assets from agents. The company was surfaced as a
  Battery Ventures portfolio company and is widely used across life sciences,
  biotech, and academic research computing.
